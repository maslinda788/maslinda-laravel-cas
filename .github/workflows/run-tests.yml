name: Unit tests

on: [push, pull_request]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.3"
            illuminate: "^12.0"
            testbench: "^10.6"
            name: "Laravel 12 / PHP 8.3"
          - php: "8.4"
            illuminate: "^12.0"
            testbench: "^10.6"
            name: "Laravel 12 / PHP 8.4"
          - php: "8.3"
            illuminate: "^13.0"
            testbench: "^11.0"
            name: "Laravel 13 / PHP 8.3"
          - php: "8.4"
            illuminate: "^13.0"
            testbench: "^11.0"
            name: "Laravel 13 / PHP 8.4"
          - php: "8.5"
            illuminate: "^13.0"
            testbench: "^11.0"
            name: "Laravel 13 / PHP 8.5"

    name: ${{ matrix.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: xdebug

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}-php${{ matrix.php }}-laravel${{ matrix.illuminate }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}-php${{ matrix.php }}-laravel${{ matrix.illuminate }}
            ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.illuminate }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --with-all-dependencies

      - name: Execute unit tests
        run: vendor/bin/phpunit --configuration phpunit.xml.dist
